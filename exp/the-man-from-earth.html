<title>The Man from Earth — One Impossible Claim</title>
<style>
:root { color-scheme:dark; --paper:#191a18; --ink:#f5f1e8; --muted:#b7b8b1; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); }
main { min-height:100svh; display:grid; place-items:center; padding:20px; }
figure { margin:0; width:min(100%,1920px); }
svg { display:block; width:100%; height:auto; }
svg text { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; fill:var(--ink); }
.display { font-family:Georgia,"Times New Roman",serif; letter-spacing:-2px; }
.name { font-size:28px; font-weight:700; letter-spacing:3px; }
.profession { font-size:16px; letter-spacing:1px; fill:var(--muted); }
.question { font-family:Georgia,"Times New Roman",serif; font-size:24px; }
.state { font-size:16px; fill:var(--muted); }
.label { font-size:16px; letter-spacing:2px; fill:var(--muted); }
.aside { font-family:Georgia,"Times New Roman",serif; font-size:24px; font-style:italic; fill:var(--muted); }
.rule { fill:none; stroke:#f5f1e8; stroke-opacity:.16; }
.ripple { fill:none; stroke:#d3ad7a; stroke-width:1; }
.icon { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.connection { fill:none; stroke:#b7b8b1; stroke-opacity:.28; stroke-width:1.5; }
.lens text.name,.lens text.question { fill:var(--lens); }
.lens { color:var(--lens); }
.harry { --lens:#a7b697; } .edith { --lens:#d3ad7a; } .dan { --lens:#ba947c; }
.sandy { --lens:#d2c8ac; } .art { --lens:#b7b8b1; } .will { --lens:#91a8bf; } .linda { --lens:#c2c7b1; }
.accessible-copy { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
@media(max-width:720px) { main { padding:0; overflow-x:auto; justify-items:start; } figure { min-width:1200px; } }
@media print { @page { size:landscape; margin:0; } body { print-color-adjust:exact; -webkit-print-color-adjust:exact; } main { min-height:0; padding:0; } figure { min-width:0; width:100%; } }
</style>

<text x="688" y="972" class="label">INTELLECTUAL CONFLICT</text>

<text x="1360" y="972" class="label">EXISTENTIAL CONSEQUENCE</text>
<text x="1360" y="1004" class="aside">What would it mean if he were?</text>
<text x="960" y="1052" font-size="20" text-anchor="middle">THEY STUDY THE PAST. HE CLAIMS TO BE THE PAST.</text>

<figcaption class="accessible-copy">
<h1>The Man from Earth: One Impossible Claim. Seven Ways of Seeing It.</h1>
<p>John Oldman, an ordinary man preparing to leave, claims to be approximately 14,000 years old and never to have aged. He claims firsthand memory of the history his colleagues reconstruct from evidence. This graphic presents his premise as a claim, not an established biological fact.</p>
<p>Harry, a biologist, tests biological survival and aging, moving from skepticism toward unease. Edith, an art history professor and devout Christian, confronts the overlap between faith, scripture and John's claimed memory. Dan, an anthropologist, considers early societies, migration and the implications of a living witness to human origins. Sandy, a historian, contrasts documents and recorded history with claimed lived experience. Art, an archaeologist, asks for physical evidence and confronts the notion of John as a living artifact. Will, a psychiatry professor, considers lying, delusion and truth without collapsing them into one diagnosis. Linda, a young student, approaches the story through curiosity, imagination and openness to possibility.</p>
<p>Seven distinct reactions surround one central claim. The ordinary room remains small while historical ripples expand around it. The vertical depth scale is illustrative: ancient civilizations and recorded history overlap, and labels indicate broad historical domains rather than precise chronological boundaries. Curiosity becomes intellectual conflict and then existential consequence; no shared conclusion is assigned.</p>
</figcaption>
