<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="youtube-methodology-title youtube-methodology-desc">
        <title id="youtube-methodology-title">Swing, Hit, Rotate, Expand, Repeat</title>
        <desc id="youtube-methodology-desc">A flowchart showing experimental YouTube videos tested as swings, successful topics promoted into a regular rotation, proven output expanded as more topics hit, and remaining capacity returning to continued discovery.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4b5260"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a14a2a"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a14a2a"/>
          </marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f4ec"/>

        <path d="M540 96 V128" fill="none" stroke="#4b5260" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M540 224 V264" fill="none" stroke="#4b5260" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M540 404 V432" fill="none" stroke="#a14a2a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M540 528 V560" fill="none" stroke="#a14a2a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M540 656 V680" fill="none" stroke="#4b5260" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M540 820 V848" fill="none" stroke="#a14a2a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M540 936 V964" fill="none" stroke="#a14a2a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M540 1052 V1080" fill="none" stroke="#a14a2a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <path d="M400 344 H216 Q200 344 200 328 V180 Q200 164 216 164 H360" fill="none" stroke="#4b5260" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M680 760 H984 Q1000 760 1000 744 V608 Q1000 592 984 592 H720" fill="none" stroke="#4b5260" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M720 1116 H1000 Q1016 1116 1016 1100 V180 Q1016 164 1000 164 H720" fill="none" stroke="#a14a2a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

        <rect x="512" y="236" width="56" height="12" rx="4" fill="#f7f4ec"/>
        <text x="540" y="244" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">TEST</text>
        <rect x="516" y="384" width="48" height="12" rx="4" fill="#f7f4ec"/>
        <text x="540" y="392" fill="#a14a2a" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">HIT</text>
        <rect x="508" y="656" width="64" height="12" rx="4" fill="#f7f4ec"/>
        <text x="540" y="664" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">TESTING</text>
        <rect x="516" y="800" width="48" height="12" rx="4" fill="#f7f4ec"/>
        <text x="540" y="808" fill="#a14a2a" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">HIT</text>
        <rect x="248" y="320" width="88" height="12" rx="4" fill="#f7f4ec"/>
        <text x="292" y="328" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">NOT YET</text>
        <rect x="752" y="736" width="88" height="12" rx="4" fill="#f7f4ec"/>
        <text x="796" y="744" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">NOT YET</text>
        <rect x="848" y="140" width="112" height="12" rx="4" fill="#f7f4ec"/>
        <text x="904" y="148" fill="#a14a2a" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">NEW SWINGS</text>

        <rect x="400" y="32" width="280" height="64" rx="32" fill="#101318"/>
        <text x="540" y="60" fill="#f7f4ec" font-family="'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="0.04em" text-anchor="middle">START BROAD</text>
        <text x="540" y="80" fill="#e0d9c2" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">2 EXPERIMENTAL VIDEOS / WEEK</text>

        <rect x="360" y="128" width="360" height="96" rx="8" fill="#fffdf8" stroke="#101318" stroke-width="1"/>
        <text x="540" y="164" fill="#101318" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Publish a swing</text>
        <text x="540" y="188" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">BROAD TOPIC / SMALL ALLOCATION</text>

        <path d="M540 264 L680 344 L540 424 L400 344 Z" fill="#fffdf8" stroke="#101318" stroke-width="1"/>
        <text x="540" y="336" fill="#101318" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Did the swing</text>
        <text x="540" y="356" fill="#101318" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">become a hit?</text>

        <rect x="360" y="432" width="360" height="96" rx="8" fill="rgba(161,74,42,0.10)" stroke="#a14a2a" stroke-width="1.2"/>
        <text x="540" y="468" fill="#101318" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Promote the topic</text>
        <text x="540" y="492" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ADD TO REGULAR ROTATION</text>

        <rect x="360" y="560" width="360" height="96" rx="8" fill="#101318" stroke="#101318" stroke-width="1"/>
        <text x="540" y="596" fill="#f7f4ec" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Protect the mix</text>
        <text x="540" y="620" fill="#e0d9c2" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">1 HIT + 1 SWING / WEEK</text>

        <path d="M540 680 L680 760 L540 840 L400 760 Z" fill="#fffdf8" stroke="#101318" stroke-width="1"/>
        <text x="540" y="752" fill="#101318" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Did another swing</text>
        <text x="540" y="772" fill="#101318" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">prove itself?</text>

        <rect x="360" y="848" width="360" height="88" rx="8" fill="rgba(161,74,42,0.10)" stroke="#a14a2a" stroke-width="1.2"/>
        <text x="540" y="884" fill="#101318" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Promote the second topic</text>
        <text x="540" y="908" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ROTATION EXPANDS</text>

        <rect x="360" y="964" width="360" height="88" rx="8" fill="#fffdf8" stroke="#101318" stroke-width="1"/>
        <text x="540" y="1000" fill="#101318" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Earn more proven slots</text>
        <text x="540" y="1024" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">4–6 HITS / MONTH + SWINGS</text>

        <rect x="360" y="1080" width="360" height="72" rx="36" fill="#f7f4ec" stroke="#a14a2a" stroke-width="1.2"/>
        <text x="540" y="1108" fill="#101318" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="0.04em" text-anchor="middle">REPEAT INDEFINITELY</text>
        <text x="540" y="1128" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">EXPLORE + EXPLOIT WITHOUT STOPPING</text>

        <line x1="32" y1="1160" x2="1168" y2="1160" stroke="rgba(16,19,24,0.12)" stroke-width="0.8"/>
        <text x="32" y="1184" fill="#4b5260" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.14em">SYSTEM</text>
        <circle cx="140" cy="1180" r="4" fill="#a14a2a"/>
        <text x="156" y="1184" fill="#4b5260" font-family="'Inter', sans-serif" font-size="12">Promote proven demand</text>
        <circle cx="400" cy="1180" r="4" fill="#4b5260"/>
        <text x="416" y="1184" fill="#4b5260" font-family="'Inter', sans-serif" font-size="12">Keep testing</text>
        <text x="1168" y="1184" fill="#8e8a81" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">THE AUDIENCE SETS THE MIX</text>
      </svg>
