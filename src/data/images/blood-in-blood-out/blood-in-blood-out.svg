    <text transform="matrix(1 0 0 1 80 984)" x="0" y="0" xml:space="preserve" font-family="&apos;Helvetica Neue&apos;" font-size="16" fill="#f5f1e8"><tspan x="0" y="0">PROMISE → ASSAULT → ADDICTION → SOBRIETY → REASON</tspan></text>
